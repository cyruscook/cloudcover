[workspace]
members = [
    "crates/cloudcover",
    "crates/cloudcover-cli",
    "crates/cloudcover-core",
    "crates/cloudcover-site-data",
    "crates/clouds/cloudcover-aws",
    "crates/langs/cloudcover-go",
    "crates/langs/cloudcover-javascript",
    "crates/langs/cloudcover-terraform",
    "crates/sdks/cloudcover-aws-sdk-go-v1",
    "crates/sdks/cloudcover-aws-sdk-go-v2",
    "crates/sdks/cloudcover-aws-sdk-js-v3",
    "crates/sdks/cloudcover-terraform-provider-aws",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cyruscook/cloudcover"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
