[workspace]
members = [
    "crates/cloudcover-cli",
    "crates/cloudcover-core",
    "crates/cloudcover-site-data",
    "crates/clouds/cloudcover-aws",
    "crates/langs/cloudcover-go",
    "crates/langs/cloudcover-terraform",
    "crates/sdks/cloudcover-aws-sdk-go-v1",
    "crates/sdks/cloudcover-terraform-provider-aws",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
