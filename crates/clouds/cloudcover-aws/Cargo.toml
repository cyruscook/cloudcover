[package]
name = "cloudcover-aws"
version.workspace = true
edition.workspace = true
build = "build.rs"
description = "AWS API and permission data for CloudCover"
license.workspace = true
repository.workspace = true

[dependencies]
cloudcover-core = { version = "0.1.3", path = "../../cloudcover-core" }
cloudcover-aws-sdk-go-v1 = { version = "0.1.3", path = "../../sdks/cloudcover-aws-sdk-go-v1" }
cloudcover-aws-sdk-go-v2 = { version = "0.1.3", path = "../../sdks/cloudcover-aws-sdk-go-v2" }
cloudcover-terraform-provider-aws = { version = "0.1.3", path = "../../sdks/cloudcover-terraform-provider-aws" }
hcl-rs = "0.19.8"
serde_json = "1.0"
thiserror = "2.0"
[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3"

[lints]
workspace = true
