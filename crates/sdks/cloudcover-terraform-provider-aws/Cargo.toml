[package]
name = "cloudcover-terraform-provider-aws"
version.workspace = true
edition.workspace = true
build = "build.rs"
description = "Terraform AWS provider method mappings for CloudCover"
license.workspace = true
repository.workspace = true

[features]
generator = [
    "dep:clap",
    "dep:cloudcover-aws-sdk-go-v1",
    "dep:cloudcover-aws-sdk-go-v2",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
]

[[bin]]
name = "generate-terraform-provider-aws-data"
path = "src/bin/generate_terraform_provider_aws_data.rs"
required-features = ["generator"]
[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
cloudcover-aws-sdk-go-v1 = { version = "0.1.0", path = "../cloudcover-aws-sdk-go-v1", optional = true }
cloudcover-aws-sdk-go-v2 = { version = "0.1.0", path = "../cloudcover-aws-sdk-go-v2", optional = true }
semver = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tempfile = { version = "3.0", optional = true }

[build-dependencies]
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
