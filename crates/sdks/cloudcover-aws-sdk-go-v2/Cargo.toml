[package]
name = "cloudcover-aws-sdk-go-v2"
version.workspace = true
edition.workspace = true
build = "build.rs"
description = "AWS SDK for Go v2 method mappings for CloudCover"
license.workspace = true
repository.workspace = true

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "generate-aws-sdk-go-v2-data"
path = "src/bin/generate_aws_sdk_go_v2_data.rs"
required-features = ["generator"]

[features]
generator = [
    "dep:clap",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
]

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.semver]
version = "1.0"
optional = true

[dependencies.tempfile]
version = "3.0"
optional = true

[dev-dependencies]
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies.semver]
version = "1.0"

[lints]
workspace = true
