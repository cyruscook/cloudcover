name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows metadata and CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Configure ARM64 C compiler
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          @'
          import subprocess
          import sys

          args = [arg for arg in sys.argv[1:] if arg != "-mthreads"]
          sys.exit(subprocess.call(["clang", "--target=aarch64-pc-windows-msvc", *args]))
          '@ | Set-Content "$env:RUNNER_TEMP\cloudcover-cc.py"
          "CC=python $env:RUNNER_TEMP\cloudcover-cc.py" | Add-Content $env:GITHUB_ENV

      - name: Verify CRLF checkout, contracts and deterministic manifest writes
        run: |
          python -B -m unittest discover -s tools -p 'test_*.py'
          python -B tools/metadata_contracts.py
          python -B tools/metadata_contracts.py --write
          git diff --exit-code

      - name: Test pinned AWS catalog and policy mappings
        run: cargo test --locked -p cloudcover-aws

      - name: Build release CLI without publishing
        run: cargo build --locked --release -p cloudcover-cli --target ${{ matrix.target }}

      - name: Run native CLI
        run: target/${{ matrix.target }}/release/cloudcover.exe --version

  sar-refresh:
    name: SAR refresh contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test no-op, pending PR and changed-catalog behavior
        run: python3 -B -m unittest discover -s tools -p 'test_refresh_sar.py'

  aws-sdk-go-v1-generator:
    name: AWS SDK Go v1 generator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Test AWS SDK Go v1 generator
        working-directory: crates/sdks/cloudcover-aws-sdk-go-v1/generator
        run: go test ./...

  aws-sdk-go-v2-generator:
    name: AWS SDK Go v2 generator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Test AWS SDK Go v2 generator
        working-directory: crates/sdks/cloudcover-aws-sdk-go-v2/generator
        run: go test ./...

  terraform-provider-analyzer:
    name: Terraform provider analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: crates/sdks/cloudcover-terraform-provider-aws/generator/go.sum

      - name: Test Terraform provider analyzer
        working-directory: crates/sdks/cloudcover-terraform-provider-aws/generator
        run: go test ./...

  javascript-generator:
    name: JavaScript generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - name: Verify patched Node.js release
        run: node -e "if (process.versions.node !== '24.22.1') throw new Error('Unexpected Node.js release'); console.log(process.version)"
      - run: npm ci
        working-directory: crates/sdks/cloudcover-aws-sdk-js-v3/generator
      - run: npm test
        working-directory: crates/sdks/cloudcover-aws-sdk-js-v3/generator

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify patched Node.js release
        run: node -e "if (process.versions.node !== '24.22.1') throw new Error('Unexpected Node.js release'); console.log(process.version)"

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Check Rust workspace
        run: cargo check --workspace --all-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check site
        run: npm --prefix site run check

      - name: Test mapping relationships
        run: npm --prefix site test

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Validate metadata manifests and contract fixtures
        run: |
          python3 -B -m unittest discover -s tools -p 'test_*.py'
          python3 tools/metadata_contracts.py

      - name: Run tests
        run: cargo test --workspace --all-features
