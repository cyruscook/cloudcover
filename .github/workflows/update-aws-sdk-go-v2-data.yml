name: Update AWS SDK Go v2 mapping data

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact service tag (empty generates all stable releases)
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-aws-sdk-go-v2-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'

      - name: Generate all stable service releases
        if: github.event_name == 'schedule' || inputs.tag == ''
        run: cargo run -p cloudcover-aws-sdk-go-v2 --features generator --bin generate-aws-sdk-go-v2-data -- --all

      - name: Generate manually selected service release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          SDK_TAG: ${{ inputs.tag }}
        run: cargo run -p cloudcover-aws-sdk-go-v2 --features generator --bin generate-aws-sdk-go-v2-data -- --tag "$SDK_TAG"

      - name: Refresh metadata manifests
        run: python3 tools/metadata_contracts.py --write

      - name: Detect generated data changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- crates/sdks/cloudcover-aws-sdk-go-v2/data)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare pull request body
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            python3 tools/metadata_contracts.py
            echo 'Generated AWS SDK Go v2 mapping data for:'
            git status --porcelain -- crates/sdks/cloudcover-aws-sdk-go-v2/data \
              | sed 's/^/- /'
          } > "$RUNNER_TEMP/aws-sdk-go-v2-data-pr-body.md"

      - name: Run focused data tests
        if: steps.changes.outputs.changed == 'true'
        run: cargo test -p cloudcover-aws-sdk-go-v2

      - name: Commit generated data
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/aws-sdk-go-v2-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/sdks/cloudcover-aws-sdk-go-v2/data
          git add -- crates/sdks/*/metadata-manifest.json
          git commit -m 'Update AWS SDK Go v2 mapping data'

      - name: Push generated data branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/aws-sdk-go-v2-data
        run: |
          remote_sha="$(git ls-remote --heads origin "$BRANCH" | awk 'NR == 1 { print $1 }')"
          if [ -n "$remote_sha" ]; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git push origin "HEAD:refs/heads/$BRANCH" --force-with-lease="refs/heads/$BRANCH:$remote_sha"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/aws-sdk-go-v2-data
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pull_request="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$pull_request" ]; then
            gh pr edit "$pull_request" \
              --title 'Update AWS SDK Go v2 mapping data' \
              --body-file "$RUNNER_TEMP/aws-sdk-go-v2-data-pr-body.md"
          else
            gh pr create \
              --head "$BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --title 'Update AWS SDK Go v2 mapping data' \
              --body-file "$RUNNER_TEMP/aws-sdk-go-v2-data-pr-body.md"
          fi
