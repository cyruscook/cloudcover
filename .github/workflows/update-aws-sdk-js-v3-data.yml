name: Update AWS SDK JavaScript/TypeScript v3 mapping data

on:
  schedule:
    - cron: '57 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-aws-sdk-js-v3-data
  cancel-in-progress: false

jobs:
  update:
    # Environment deployment policy MUST permit only main (branches, not tags).
    if: github.repository == 'cyruscook/cloudcover' && github.ref == 'refs/heads/main'
    environment: cloudcover-updater
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: crates/sdks/cloudcover-aws-sdk-js-v3/generator/package-lock.json
      - name: Verify patched Node.js release
        run: node -e "if (process.versions.node !== '24.22.1') throw new Error('Unexpected Node.js release'); console.log(process.version)"

      - name: Install generator dependencies
        run: npm ci --prefix crates/sdks/cloudcover-aws-sdk-js-v3/generator

      - name: Test JavaScript SDK generator
        run: npm test --prefix crates/sdks/cloudcover-aws-sdk-js-v3/generator

      # The generator replaces the output file, so always retain all release history.
      - name: Generate all stable package releases
        run: node crates/sdks/cloudcover-aws-sdk-js-v3/generator/generate.mjs --all

      - name: Refresh metadata manifests
        run: python3 tools/metadata_contracts.py --write

      - name: Detect generated data changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- crates/sdks/cloudcover-aws-sdk-js-v3/data)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare pull request body
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            python3 tools/metadata_contracts.py
            echo 'Generated AWS SDK JavaScript/TypeScript v3 mapping data for:'
            git status --porcelain -- crates/sdks/cloudcover-aws-sdk-js-v3/data \
              | sed 's/^/- /'
          } > "$RUNNER_TEMP/aws-sdk-js-v3-data-pr-body.md"

      - name: Run focused data tests
        if: steps.changes.outputs.changed == 'true'
        run: cargo test -p cloudcover-aws-sdk-js-v3

      - name: Validate generated publication paths
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/aws-sdk-js-v3-data
          SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/validate_generated_publication.py "$UPDATE_BRANCH" "$SOURCE_SHA" --worktree

      - name: Commit generated data
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/aws-sdk-js-v3-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/sdks/cloudcover-aws-sdk-js-v3/data
          git add -- crates/sdks/*/metadata-manifest.json
          git commit -m 'Update AWS SDK JavaScript/TypeScript v3 mapping data'

      - name: Validate committed publication
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/aws-sdk-js-v3-data
          SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/validate_generated_publication.py "$UPDATE_BRANCH" "$SOURCE_SHA"

      - name: Create repository-scoped updater token
        if: steps.changes.outputs.changed == 'true'
        id: updater-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CLOUDCOVER_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLOUDCOVER_UPDATER_APP_PRIVATE_KEY }}
          owner: cyruscook
          repositories: cloudcover
          permission-contents: write
          permission-pull-requests: write

      - name: Push generated data branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.updater-token.outputs.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
          BRANCH: automation/aws-sdk-js-v3-data
        run: |
          remote_sha="$(git ls-remote --heads origin "$BRANCH" | awk 'NR == 1 { print $1 }')"
          if [ -n "$remote_sha" ]; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git push origin "HEAD:refs/heads/$BRANCH" --force-with-lease="refs/heads/$BRANCH:$remote_sha"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/aws-sdk-js-v3-data
          GH_TOKEN: ${{ steps.updater-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pull_request="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$pull_request" ]; then
            gh pr edit "$pull_request" \
              --title 'Update AWS SDK JavaScript/TypeScript v3 mapping data' \
              --body-file "$RUNNER_TEMP/aws-sdk-js-v3-data-pr-body.md"
          else
            gh pr create \
              --head "$BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --title 'Update AWS SDK JavaScript/TypeScript v3 mapping data' \
              --body-file "$RUNNER_TEMP/aws-sdk-js-v3-data-pr-body.md"
          fi
