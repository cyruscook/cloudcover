name: Update Terraform AWS provider permission data

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable provider version to generate
        required: false
        type: string
        default: ''
      from:
        description: Inclusive lower bound for an --all generation
        required: false
        type: string
        default: ''
      to:
        description: Inclusive upper bound for an --all generation
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-terraform-provider-aws-data
  cancel-in-progress: false

jobs:
  update:
    # Environment deployment policy MUST permit only main (branches, not tags).
    if: github.repository == 'cyruscook/cloudcover' && github.ref == 'refs/heads/main'
    environment: cloudcover-updater
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: crates/sdks/cloudcover-terraform-provider-aws/generator/go.mod

      - name: Generate scheduled stable releases
        if: github.event_name == 'schedule'
        run: cargo run -p cloudcover-terraform-provider-aws --features generator --bin generate-terraform-provider-aws-data -- --all --from '6.64.0'

      - name: Validate manual selection
        if: github.event_name == 'workflow_dispatch' && inputs.version != '' && (inputs.from != '' || inputs.to != '')
        run: |
          echo 'version cannot be combined with from or to' >&2
          exit 1

      - name: Generate manually selected version
        if: github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.from == '' && inputs.to == ''
        env:
          VERSION: ${{ inputs.version }}
        run: cargo run -p cloudcover-terraform-provider-aws --features generator --bin generate-terraform-provider-aws-data -- --version "$VERSION"

      - name: Generate all stable releases
        if: github.event_name == 'workflow_dispatch' && inputs.version == '' && inputs.from == '' && inputs.to == ''
        run: cargo run -p cloudcover-terraform-provider-aws --features generator --bin generate-terraform-provider-aws-data -- --all

      - name: Generate releases from a lower bound
        if: github.event_name == 'workflow_dispatch' && inputs.version == '' && inputs.from != '' && inputs.to == ''
        env:
          FROM_VERSION: ${{ inputs.from }}
        run: cargo run -p cloudcover-terraform-provider-aws --features generator --bin generate-terraform-provider-aws-data -- --all --from "$FROM_VERSION"

      - name: Generate releases to an upper bound
        if: github.event_name == 'workflow_dispatch' && inputs.version == '' && inputs.from == '' && inputs.to != ''
        env:
          TO_VERSION: ${{ inputs.to }}
        run: cargo run -p cloudcover-terraform-provider-aws --features generator --bin generate-terraform-provider-aws-data -- --all --to "$TO_VERSION"

      - name: Generate releases in a bounded range
        if: github.event_name == 'workflow_dispatch' && inputs.version == '' && inputs.from != '' && inputs.to != ''
        env:
          FROM_VERSION: ${{ inputs.from }}
          TO_VERSION: ${{ inputs.to }}
        run: cargo run -p cloudcover-terraform-provider-aws --features generator --bin generate-terraform-provider-aws-data -- --all --from "$FROM_VERSION" --to "$TO_VERSION"

      - name: Refresh metadata manifests
        run: python3 tools/metadata_contracts.py --write

      - name: Detect generated data changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- crates/sdks/cloudcover-terraform-provider-aws/data)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare pull request body
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            python3 tools/metadata_contracts.py
            echo 'Generated Terraform AWS provider permission data for:'
            git status --porcelain -- crates/sdks/cloudcover-terraform-provider-aws/data \
              | sed -nE 's#.*([0-9]+\.[0-9]+\.[0-9]+)\.json$#- \1#p' \
              | sort -uV
          } > "$RUNNER_TEMP/terraform-provider-aws-data-pr-body.md"

      - name: Run focused data tests
        if: steps.changes.outputs.changed == 'true'
        run: cargo test -p cloudcover-terraform-provider-aws

      - name: Validate generated publication paths
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/terraform-provider-aws-data
          SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/validate_generated_publication.py "$UPDATE_BRANCH" "$SOURCE_SHA" --worktree

      - name: Commit generated data
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/terraform-provider-aws-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/sdks/cloudcover-terraform-provider-aws/data
          git add -- crates/sdks/*/metadata-manifest.json
          git commit -m 'Update Terraform AWS provider permission data'

      - name: Validate committed publication
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/terraform-provider-aws-data
          SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/validate_generated_publication.py "$UPDATE_BRANCH" "$SOURCE_SHA"

      - name: Create repository-scoped updater token
        if: steps.changes.outputs.changed == 'true'
        id: updater-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CLOUDCOVER_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLOUDCOVER_UPDATER_APP_PRIVATE_KEY }}
          owner: cyruscook
          repositories: cloudcover
          permission-contents: write
          permission-pull-requests: write

      - name: Push generated data branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.updater-token.outputs.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
          BRANCH: automation/terraform-provider-aws-data
        run: |
          python3 tools/publish_generated_branch.py "$BRANCH"

      # Run even when publication preserved an identical existing branch: recover a missing PR.
      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/terraform-provider-aws-data
          GH_TOKEN: ${{ steps.updater-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pull_request="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$pull_request" ]; then
            gh pr edit "$pull_request" \
              --title 'Update Terraform AWS provider permission data' \
              --body-file "$RUNNER_TEMP/terraform-provider-aws-data-pr-body.md"
          else
            gh pr create \
              --head "$BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --title 'Update Terraform AWS provider permission data' \
              --body-file "$RUNNER_TEMP/terraform-provider-aws-data-pr-body.md"
          fi
